# FamousBooks — nginx konfiguratsiyasi
# /etc/nginx/sites-available/famous-books  ga qo'yiladi va sites-enabled ga
# symlink qilinadi. Frontend statik fayllari va API bitta origindan beriladi,
# shuning uchun CORS kerak emas.

server {
    listen 80;
    listen [::]:80;
    server_name 212.47.58.42;

    root /var/www/famous-books;
    index index.html;

    # Rasm yuklash uchun (Spring tomonida ham limit oshirilishi kerak)
    client_max_body_size 20m;

    # Hashlangan nomli statik fayllar — uzoq keshlanadi
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API va OAuth2 — backendga uzatiladi
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;

        # Spring tashqi manzilni (OAuth2 redirect_uri uchun) shulardan biladi
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # SPA: /login, /my-posts kabi manzillar ham index.html ga tushsin,
    # aks holda sahifa yangilanganda 404 bo'ladi
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html keshlanmasin — yangi versiya darhol ko'rinsin
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
